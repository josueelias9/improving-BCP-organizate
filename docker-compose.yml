services:

  new-service:
    container_name: new-service-container
    build: 
      context: ./new-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      new-service-init:
        condition: service_completed_successfully
    volumes:
      - ./files:/shared_files
      - /mnt/c/Users/josue/Downloads:/downloads

  new-service-init:
    build: ./new-service
    command: bash scripts/prestart.sh
    env_file:
      - .env
    container_name: new-service-init-container
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  frontend:
    container_name: frontend-container
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./files:/shared_files
      - /mnt/c/Users/josue/Downloads:/downloads

volumes:
  pgadmin_data:
