services:

  new-service:
    container_name: new-service-container
    build: 
      context: ./new-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./files:/shared_files
      - /mnt/c/Users/josue/Downloads:/downloads

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  frontend:
    container_name: frontend-container
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./files:/shared_files
      - /mnt/c/Users/josue/Downloads:/downloads

volumes:
  pgadmin_data:
